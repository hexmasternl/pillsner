name: Bug report
description: Something in Pillsner does not work the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The fields below match the
        form on [pillsner.hexmaster.nl](https://pillsner.hexmaster.nl/en/report-a-bug/),
        so anything you filled in there is already prefilled here.

        Please do not include medication names, dosages or anything else you
        would rather not have in a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what the app did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, so we can see it for ourselves.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the bottom of Settings, under About.
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7, Android 15"
    validations:
      required: false
