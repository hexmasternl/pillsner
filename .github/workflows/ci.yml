name: CI

on:
  pull_request:
    paths-ignore:
      - "src/website/**"
  push:
    branches: [main, development]
    paths-ignore:
      - "src/website/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Every app language needs Play release notes within Play's 500-character limit; also
      # tests the release-notes drafting script. Cheap, so it runs before the Gradle setup.
      - name: Release notes check
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default package list still contains the obsolete "tools" package, which
          # Google removed from the SDK repository, so sdkmanager fails. Only platform-tools is
          # wanted here; the components the build needs are pinned in the next step.
          packages: platform-tools

      - name: Install the pinned SDK components
        # Since Android moved to minor SDK releases, platform packages carry the minor version: there
        # is no bare "platforms;android-37". compileSdk 37 with no compileSdkMinor resolves to 37.0.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            src/**/build/reports/**
            src/**/build/test-results/**
          retention-days: 1

  instrumented-tests:
    name: Instrumented tests
    # Pull requests only: the push that follows a merge carries a commit that was already tested
    # as a pull request, and a push to main is a release that shouldn't wait on an emulator
    # (ci-instrumented-tests D3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable KVM
        # Without hardware acceleration the emulator falls back to software emulation and the run
        # takes many times longer. The runner user isn't in the kvm group, so open the device up.
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # See the build job: the default package list fails on the removed "tools" package.
          packages: platform-tools

      - name: Install the pinned SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Cache the managed-device images and AVDs
        # The system images and the AVDs Gradle creates from them are large and slow to set up. A
        # hit skips the download and lets the AVD resume from its snapshot instead of cold-booting
        # (ci-instrumented-tests D4). Keyed on the two build files, which hold the device blocks.
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/gradle-managed
            ${{ env.ANDROID_HOME }}/system-images
          key: managed-devices-${{ runner.os }}-${{ hashFiles('src/app/build.gradle.kts', 'src/wear/build.gradle.kts') }}

      - name: Run the instrumented tests on the managed devices
        # The full suite of both modules, never a selection: this is the gate local selective runs
        # rely on. The devices are defined in each module's testOptions.managedDevices.
        run: >
          ./gradlew :app:phoneApi37DebugAndroidTest :wear:watchApi37DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload instrumented test reports on failure
        # Without these the job only says a task failed, not which test or why (ci-instrumented-tests D6).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            src/*/build/reports/androidTests/**
            src/*/build/outputs/androidTest-results/**
          retention-days: 7
