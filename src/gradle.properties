# Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.configuration-cache=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Java toolchains
# Resolve the toolchain to the JVM the daemon runs on (JAVA_HOME), never to an auto-detected
# runtime elsewhere on the machine. IDE-bundled runtimes carry javac but no jlink, which Gradle
# accepts as a JDK and AGP then fails on when it builds the Android system-modules image.
org.gradle.java.installations.auto-detect=false
