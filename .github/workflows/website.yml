name: Website

on:
  push:
    branches: [main]
    paths:
      - "src/website/**"
      # The site renders the app screenshots straight from docs/screens/ (mounted
      # into Hugo's assets), so a new or updated screenshot has to redeploy it too.
      - "docs/screens/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.165.0"
  AZURE_LOCATION: "westeurope"
  # Names for the resource group and Static Web App the infra deployment provisions
  # (or updates, idempotently) on every run. Not secret, safe to keep here.
  SWA_APP_NAME: "pillsner-website"
  SWA_RESOURCE_GROUP: "rg-pillsner-website"

jobs:
  deploy:
    name: Provision, build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Hugo ${{ env.HUGO_VERSION }} (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        working-directory: src/website
        run: hugo --minify

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          # These three secrets are the OIDC federated-credential identity for this repository's
          # main branch — there is no client secret or deployment token to leak or rotate.
          client-id: ${{ secrets.AZURE_WEBSITE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_WEBSITE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_WEBSITE_SUBSCRIPTION_ID }}

      - name: Provision the resource group and Static Web App
        id: infra
        # Subscription-scoped Bicep deployment: creates the resource group and the Free-tier
        # Static Web App if they don't exist yet, or no-ops if they already match.
        run: |
          OUTPUTS=$(az deployment sub create \
            --name "website-$(date +%s)" \
            --location "$AZURE_LOCATION" \
            --template-file infra/website/main.bicep \
            --parameters resourceGroupName="$SWA_RESOURCE_GROUP" staticWebAppName="$SWA_APP_NAME" location="$AZURE_LOCATION" \
            --query properties.outputs -o json)
          echo "hostname=$(echo "$OUTPUTS" | jq -r '.defaultHostname.value')" >> "$GITHUB_OUTPUT"

      - name: Get a deployment token
        id: token
        # A @secure() Bicep output round-tripped through this nested-module/subscription-scope
        # deployment didn't survive intact (swa deploy rejected it as invalid), so the token is
        # fetched directly instead - the pattern Microsoft's own CI/CD docs recommend for this.
        run: |
          TOKEN=$(az staticwebapp secrets list --name "$SWA_APP_NAME" --resource-group "$SWA_RESOURCE_GROUP" --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        working-directory: src/website
        run: |
          npx --yes @azure/static-web-apps-cli@latest deploy ./public \
            --deployment-token "$DEPLOYMENT_TOKEN" \
            --env production
        env:
          DEPLOYMENT_TOKEN: ${{ steps.token.outputs.value }}

      - name: Summary
        run: echo "Deployed to https://${{ steps.infra.outputs.hostname }}" >> "$GITHUB_STEP_SUMMARY"
