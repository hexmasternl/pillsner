baseURL = "https://pillsner.hexmaster.nl/"
locale = "en"
title = "Pillsner"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = false
summaryLength = 30
enableEmoji = false
disableKinds = ["taxonomy", "term", "section"]

[outputs]
  home = ["html"]

[permalinks]
  page = "/:slug/"

[languages]
  [languages.en]
    label = "English"
    direction = "ltr"
    weight = 1
    contentDir = "content/en"
  [languages.nl]
    label = "Nederlands"
    direction = "ltr"
    weight = 2
    contentDir = "content/nl"
  [languages.fr]
    label = "Français"
    direction = "ltr"
    weight = 3
    contentDir = "content/fr"
  [languages.es]
    label = "Español"
    direction = "ltr"
    weight = 4
    contentDir = "content/es"
  [languages.pt]
    label = "Português"
    direction = "ltr"
    weight = 5
    contentDir = "content/pt"
  [languages.de]
    label = "Deutsch"
    direction = "ltr"
    weight = 6
    contentDir = "content/de"

[sitemap]
  changeFreq = "monthly"
  priority = 0.5

# One menu shared by every language: entries resolve per locale through
# pageRef, and their labels come from i18n/<lang>.toml via the identifier
# (key "nav_<identifier>"), so English stays the fallback for any locale
# that has not translated a label yet.
[[menus.main]]
  identifier = "home"
  pageRef = "/"
  weight = 10
[[menus.main]]
  identifier = "medicines"
  pageRef = "/medicines"
  weight = 20
[[menus.main]]
  identifier = "schedules"
  pageRef = "/schedules"
  weight = 30
[[menus.main]]
  identifier = "tracking"
  pageRef = "/tracking"
  weight = 40
[[menus.main]]
  identifier = "wearable"
  pageRef = "/wearable"
  weight = 50
[[menus.main]]
  identifier = "privacy"
  pageRef = "/privacy"
  weight = 60
[[menus.main]]
  identifier = "faq"
  pageRef = "/faq"
  weight = 70
[[menus.main]]
  identifier = "report_a_bug"
  pageRef = "/report-a-bug"
  weight = 80
[[menus.main]]
  identifier = "request_a_feature"
  pageRef = "/request-a-feature"
  weight = 90

# The app screenshots in docs/screens/ are mounted into Hugo's assets so the
# site can resize them at build time instead of keeping a second copy of every
# PNG. Declaring a mount replaces the default one for that component, so the
# site's own assets/ directory is mounted explicitly alongside it.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../../docs/screens"
    target = "assets/images/screens"

[params]
  playStoreUrl = "https://play.google.com/store/apps/details?id=nl.hexmaster.pillsner"
  githubUrl = "https://github.com/hexmasternl/pillsner"
  privacyPolicyUrl = "https://github.com/hexmasternl/pillsner/blob/main/PRIVACY.md"
  siteName = "Pillsner"
  betaGroupUrl = "https://groups.google.com/g/pillsner-closed-tests"
  betaTesterUrl = "https://play.google.com/apps/testing/nl.hexmaster.pillsner"

  [params.ogLocales]
    en = "en_US"
    nl = "nl_NL"
    fr = "fr_FR"
    es = "es_ES"
    pt = "pt_PT"
    de = "de_DE"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false

[build]
  writeStats = false

[caches]
  [caches.images]
    dir = ":resourceDir/_gen"
    maxAge = -1
