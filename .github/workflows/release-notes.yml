name: Draft release notes

# Drafts brief Play Store "what's new" text in every app language (en, nl, de, fr, es, pt) for a
# development -> main release pull request, from the OpenSpec changes (and fallback merged PRs)
# it contains, and posts it as an updatable PR comment for a human to review and hand-copy.
# Never commits or pushes anything, and never blocks ci.yml or release.yml.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft release notes
    if: github.event.pull_request.head.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Collect shipped changes
        id: collect
        run: |
          python3 .github/scripts/collect_release_notes.py collect \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out "${{ runner.temp }}/release-notes-context.json"

      - name: Post "nothing new" comment
        if: steps.collect.outputs.has_content != 'true'
        run: |
          python3 .github/scripts/collect_release_notes.py comment \
            --pr "${{ github.event.pull_request.number }}" \
            --nothing-new

      - name: Build the drafting prompt
        if: steps.collect.outputs.has_content == 'true'
        run: |
          python3 .github/scripts/collect_release_notes.py format-prompt \
            --context "${{ runner.temp }}/release-notes-context.json" \
            --whatsnew-dir distribution/whatsnew \
            --out "${{ runner.temp }}/release-notes-prompt.txt"

      - name: Set up Node.js
        if: steps.collect.outputs.has_content == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        if: steps.collect.outputs.has_content == 'true'
        run: npm install -g @github/copilot

      - name: Draft English release notes
        if: steps.collect.outputs.has_content == 'true'
        id: draft_en
        uses: actions/ai-inference@v3
        with:
          # Deliberately empty: actions/ai-inference only passes --model to the Copilot CLI when
          # this is non-empty, so an empty string lets the CLI use its account's own default model
          # instead of a hardcoded name that can go stale as GitHub's model catalog changes.
          model: ""
          token: ${{ github.token }}
          system-prompt: >-
            You write brief, warm, non-technical "what's new" release notes for the Google Play
            Store listing of a medication-reminder app called Pillsner. Write only the notes
            themselves, as a short list of bullet points (no more than 6), in plain English,
            matching the tone and length of the style reference you are given, and staying
            under 500 characters. Do not invent features that are not described in the input.
            Respond in English only: no other language, no translation, no headings or labels
            naming the language, just the bullet points.
          prompt-file: ${{ runner.temp }}/release-notes-prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GIHUB_COPILOT_API_KEY }}

      - name: Draft Dutch release notes
        if: steps.collect.outputs.has_content == 'true'
        id: draft_nl
        uses: actions/ai-inference@v3
        with:
          model: ""
          token: ${{ github.token }}
          system-prompt: >-
            You write brief, warm, non-technical "what's new" release notes for the Google Play
            Store listing of a medication-reminder app called Pillsner. Write only the notes
            themselves, as a short list of bullet points (no more than 6), in plain Dutch,
            matching the tone and length of the style reference you are given, and staying
            under 500 characters. Do not invent features that are not described in the input.
            Respond in Dutch only: no other language, no translation, no headings or labels
            naming the language, just the bullet points.
          prompt-file: ${{ runner.temp }}/release-notes-prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GIHUB_COPILOT_API_KEY }}

      - name: Draft German release notes
        if: steps.collect.outputs.has_content == 'true'
        id: draft_de
        uses: actions/ai-inference@v3
        with:
          model: ""
          token: ${{ github.token }}
          system-prompt: >-
            You write brief, warm, non-technical "what's new" release notes for the Google Play
            Store listing of a medication-reminder app called Pillsner. Write only the notes
            themselves, as a short list of bullet points (no more than 6), in plain German,
            matching the tone and length of the style reference you are given, and staying
            under 500 characters. Do not invent features that are not described in the input.
            Respond in German only: no other language, no translation, no headings or labels
            naming the language, just the bullet points.
          prompt-file: ${{ runner.temp }}/release-notes-prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GIHUB_COPILOT_API_KEY }}

      - name: Draft French release notes
        if: steps.collect.outputs.has_content == 'true'
        id: draft_fr
        uses: actions/ai-inference@v3
        with:
          model: ""
          token: ${{ github.token }}
          system-prompt: >-
            You write brief, warm, non-technical "what's new" release notes for the Google Play
            Store listing of a medication-reminder app called Pillsner. Write only the notes
            themselves, as a short list of bullet points (no more than 6), in plain French,
            matching the tone and length of the style reference you are given, and staying
            under 500 characters. Do not invent features that are not described in the input.
            Respond in French only: no other language, no translation, no headings or labels
            naming the language, just the bullet points.
          prompt-file: ${{ runner.temp }}/release-notes-prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GIHUB_COPILOT_API_KEY }}

      - name: Draft Spanish release notes
        if: steps.collect.outputs.has_content == 'true'
        id: draft_es
        uses: actions/ai-inference@v3
        with:
          model: ""
          token: ${{ github.token }}
          system-prompt: >-
            You write brief, warm, non-technical "what's new" release notes for the Google Play
            Store listing of a medication-reminder app called Pillsner. Write only the notes
            themselves, as a short list of bullet points (no more than 6), in plain Spanish,
            matching the tone and length of the style reference you are given, and staying
            under 500 characters. Do not invent features that are not described in the input.
            Respond in Spanish only: no other language, no translation, no headings or labels
            naming the language, just the bullet points.
          prompt-file: ${{ runner.temp }}/release-notes-prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GIHUB_COPILOT_API_KEY }}

      - name: Draft European Portuguese release notes
        if: steps.collect.outputs.has_content == 'true'
        id: draft_pt
        uses: actions/ai-inference@v3
        with:
          model: ""
          token: ${{ github.token }}
          system-prompt: >-
            You write brief, warm, non-technical "what's new" release notes for the Google Play
            Store listing of a medication-reminder app called Pillsner. Write only the notes
            themselves, as a short list of bullet points (no more than 6), in plain European Portuguese,
            matching the tone and length of the style reference you are given, and staying
            under 500 characters. Do not invent features that are not described in the input.
            Respond in European Portuguese only: no other language, no translation, no headings or labels
            naming the language, just the bullet points.
          prompt-file: ${{ runner.temp }}/release-notes-prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GIHUB_COPILOT_API_KEY }}

      - name: Post drafted release notes comment
        if: steps.collect.outputs.has_content == 'true'
        env:
          DRAFT_EN: ${{ steps.draft_en.outputs.response }}
          DRAFT_NL: ${{ steps.draft_nl.outputs.response }}
          DRAFT_DE: ${{ steps.draft_de.outputs.response }}
          DRAFT_FR: ${{ steps.draft_fr.outputs.response }}
          DRAFT_ES: ${{ steps.draft_es.outputs.response }}
          DRAFT_PT: ${{ steps.draft_pt.outputs.response }}
        run: |
          printf '%s' "$DRAFT_EN" > "${{ runner.temp }}/draft-en.txt"
          printf '%s' "$DRAFT_NL" > "${{ runner.temp }}/draft-nl.txt"
          printf '%s' "$DRAFT_DE" > "${{ runner.temp }}/draft-de.txt"
          printf '%s' "$DRAFT_FR" > "${{ runner.temp }}/draft-fr.txt"
          printf '%s' "$DRAFT_ES" > "${{ runner.temp }}/draft-es.txt"
          printf '%s' "$DRAFT_PT" > "${{ runner.temp }}/draft-pt.txt"
          python3 .github/scripts/collect_release_notes.py comment \
            --pr "${{ github.event.pull_request.number }}" \
            --draft en="${{ runner.temp }}/draft-en.txt" \
            --draft nl="${{ runner.temp }}/draft-nl.txt" \
            --draft de="${{ runner.temp }}/draft-de.txt" \
            --draft fr="${{ runner.temp }}/draft-fr.txt" \
            --draft es="${{ runner.temp }}/draft-es.txt" \
            --draft pt="${{ runner.temp }}/draft-pt.txt"
