<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pillsner: Your partner in taking your pills</title>
  <meta name="description" content="Pillsner is a native Android app that reminds you to take your medication on time and records whether you did. Choose your language below.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="canonical" href="{{ .Site.BaseURL }}">
  {{ range .Site.Home.AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{ end }}
  <link rel="alternate" hreflang="x-default" href="{{ .Site.BaseURL }}">
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #F9FBFA; color: #191C1B; margin: 0; padding: 48px 16px; text-align: center; }
    a { color: #1B7F5C; }
    ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    li a { display: inline-block; padding: 8px 16px; border: 1px solid #6F7975; border-radius: 999px; text-decoration: none; }
  </style>
  <script>
    (function () {
      // Client-side language routing: this is a plain static page with no
      // server available to negotiate Accept-Language, so detection happens
      // here. A visitor who chose a language manually before (recorded by
      // assets/js/language.js on a locale page) is honoured first; failing
      // that, the browser's own language list decides; failing that, English.
      var supported = [{{ range $i, $t := .Site.Home.AllTranslations }}{{ if $i }},{{ end }}"{{ $t.Language.Lang }}"{{ end }}];

      function firstSupportedMatch(tags) {
        for (var i = 0; i < tags.length; i++) {
          var base = String(tags[i]).toLowerCase().split("-")[0];
          if (supported.indexOf(base) !== -1) return base;
        }
        return null;
      }

      var stored = null;
      try { stored = window.localStorage.getItem("pillsner-lang"); } catch (e) { /* private mode, blocked storage: ignore */ }

      var target = (stored && supported.indexOf(stored) !== -1)
        ? stored
        : firstSupportedMatch(navigator.languages || [navigator.language || "en"]) || "en";

      window.location.replace("/" + target + "/");
    })();
  </script>
</head>
<body>
  <noscript>
    <h1>Pillsner: Your partner in taking your pills</h1>
    <p>Pillsner reminds you to take your medication on time and records whether you did, reliably and privately, on your device.</p>
    <p>Choose your language:</p>
    <ul>
      {{ range .Site.Home.AllTranslations.ByLanguage }}
      <li><a href="{{ .Permalink }}">{{ .Language.Label }}</a></li>
      {{ end }}
    </ul>
  </noscript>
</body>
</html>
