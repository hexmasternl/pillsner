name: Release to Google Play

# Compile, bundle, publish. Nothing else. Tests and lint live in ci.yml, which guards pull
# requests; a push that reaches main has already been through them.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: write # needed to create the tag and the GitHub release at the end

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and upload
    runs-on: ubuntu-latest
    environment: google-play # pauses here for the reviewer configured in Part 7
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # GitVersion needs the full history and every tag to work out the version.
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Work out the version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Derive the Play version code
        id: version
        working-directory: .
        env:
          MAJOR: ${{ steps.gitversion.outputs.major }}
          MINOR: ${{ steps.gitversion.outputs.minor }}
          PATCH: ${{ steps.gitversion.outputs.patch }}
          NAME: ${{ steps.gitversion.outputs.majorMinorPatch }}
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          # Part 5 of the publishing guide. Room for 9,999 patches per minor and 99 minors per
          # major, which a per-commit patch increment needs; phone takes base * 10, watch base * 10 + 1.
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 9999 ] || [ "$MAJOR" -gt 209 ]; then
            echo "::error::Version $NAME does not fit the version code scheme (major <= 209, minor <= 99, patch <= 9999)"
            exit 1
          fi
          BASE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH ))
          TRACK="${INPUT_TRACK:-internal}"
          # Play keeps Wear OS releases on their own form factor track, named "wear:" plus the
          # default track name; the internal testing track is called "qa" there, not "internal".
          # Closed testing tracks are named after the track created in Play Console, so "alpha"
          # has no automatic equivalent - fail here rather than half-publish.
          case "$TRACK" in
            internal)   WEAR_TRACK="wear:qa" ;;
            beta)       WEAR_TRACK="wear:beta" ;;
            production) WEAR_TRACK="wear:production" ;;
            *)
              echo "::error::No Wear OS track maps to '$TRACK'. Closed testing tracks are named wear:<your track name>; set it explicitly before publishing to $TRACK."
              exit 1 ;;
          esac
          {
            echo "name=$NAME"
            echo "code=$BASE"
            echo "track=$TRACK"
            echo "wearTrack=$WEAR_TRACK"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME (phone ${BASE}0 to $TRACK, watch ${BASE}1 to $WEAR_TRACK)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned SDK components
        # Since Android moved to minor SDK releases, platform packages carry the minor version: there
        # is no bare "platforms;android-37". compileSdk 37 with no compileSdkMinor resolves to 37.0.
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Build both bundles
        id: build
        env:
          PILLSNER_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          PILLSNER_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PILLSNER_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PILLSNER_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PILLSNER_VERSION_CODE: ${{ steps.version.outputs.code }}
          PILLSNER_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:bundleRelease :wear:bundleRelease

      - name: Confirm both bundles are signed
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify wear/build/outputs/bundle/release/wear-release.aab

      # The phone and the watch bundle cannot share a release: Play rejects any artifact that
      # requires android.hardware.type.watch on a phone track. Each goes to its own track, in its
      # own edit. Paths are relative to the repository root - uses-steps ignore defaults.run.
      # changesNotSentForReview stays true: an app whose store listing has never been
      # reviewed cannot have its changes sent for review through the API. The edit commits,
      # then the release is sent for review once from the Play Console. It can go back to
      # false after the first review has completed.
      - name: Upload the phone bundle to Google Play
        id: upload_phone
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.hexmaster.pillsner
          releaseFiles: src/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.version.outputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true

      - name: Upload the watch bundle to Google Play
        id: upload_watch
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.hexmaster.pillsner
          releaseFiles: src/wear/build/outputs/bundle/release/wear-release.aab
          tracks: ${{ steps.version.outputs.wearTrack }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true

      - name: Tag the commit and create the GitHub release
        # Runs whether or not Play accepted the bundles, so a build that produced signed bundles is
        # always tagged and downloadable from GitHub. The notes say what actually reached the store,
        # so a tag never implies a store release that did not happen.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          TRACK: ${{ steps.version.outputs.track }}
          WEAR_TRACK: ${{ steps.version.outputs.wearTrack }}
          CODE: ${{ steps.version.outputs.code }}
          PHONE_OUTCOME: ${{ steps.upload_phone.outcome }}
          WATCH_OUTCOME: ${{ steps.upload_watch.outcome }}
        run: |
          describe() {
            case "$1" in
              success) echo "published to the Play **$2** track" ;;
              failure) echo "NOT published: the upload to **$2** failed" ;;
              skipped) echo "NOT published: the upload to **$2** never ran" ;;
              *) echo "upload to **$2** ended as '$1'" ;;
            esac
          }
          NOTES="Phone version code ${CODE}0 $(describe "$PHONE_OUTCOME" "$TRACK"). Watch version code ${CODE}1 $(describe "$WATCH_OUTCOME" "$WEAR_TRACK")."
          PHONE_AAB=src/app/build/outputs/bundle/release/app-release.aab
          WATCH_AAB=src/wear/build/outputs/bundle/release/wear-release.aab
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # A rerun on the same commit: refresh the one release rather than failing on a tag
            # that already exists.
            echo "Release v$VERSION already exists; updating its notes and assets."
            gh release edit "v$VERSION" --notes "$NOTES"
            gh release upload "v$VERSION" "$PHONE_AAB" "$WATCH_AAB" --clobber
          else
            gh release create "v$VERSION" \
              --title "Pillsner $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --notes "$NOTES" \
              "$PHONE_AAB" \
              "$WATCH_AAB"
          fi

      - name: Keep the bundles as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillsner-${{ steps.version.outputs.name }}
          path: |
            src/app/build/outputs/bundle/release/app-release.aab
            src/wear/build/outputs/bundle/release/wear-release.aab
          retention-days: 7
